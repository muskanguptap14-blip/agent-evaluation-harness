[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "A lightweight local CLI for evaluating Python code-generation tasks"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_eval"]
